<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Digital Garden (prototype)</title>
<script>
/* First open of a session always starts on the opening page. "Enter" on that page sets the flag; "Exit" clears it. */
(function(){ try { if (!sessionStorage.getItem('dg:entered')){ document.documentElement.style.display = 'none'; location.replace('onboarding.html'); } } catch (e) {} })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f5f5; --ink:#2b2b2b; --line:#4a4a4a; --tile:#ffffff; --modal:#f9f9f9;
    --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
    --ui:'Figtree',var(--sans);
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){--bg:#1b1b1b; --ink:#ececec; --line:#a5a5a5; --tile:#ececec; --modal:#242424;}
  }
  :root[data-theme="dark"]{--bg:#1b1b1b; --ink:#ececec; --line:#a5a5a5; --tile:#ececec; --modal:#242424;}
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--mono);overflow:hidden}

  .btn{font:400 14px/21px var(--mono);padding:4px 16px;border:1px solid var(--ink);border-radius:4px;background:transparent;color:var(--ink);cursor:pointer}
  .btn:hover{background:color-mix(in srgb,var(--ink) 8%,transparent)}
  .btn.on,.btn[aria-selected="true"],.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
  .btn:focus-visible,.rail button:focus-visible,.tile:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

  #stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .tree-line{fill:none;stroke:var(--line);stroke-width:1;vector-effect:non-scaling-stroke}
  .dot{fill:var(--ink)}
  .compost-tile{fill:var(--ink)}
  .label{font:400 14px var(--mono);fill:var(--ink);text-anchor:middle}
  .ascii{font:400 24px var(--mono);fill:var(--ink);white-space:pre}
  .caption{font:400 11px var(--sans);fill:var(--ink);text-anchor:middle}
  .empty{font:400 14px var(--mono);fill:var(--ink);text-anchor:middle}
  .compost-ascii{text-anchor:middle}
  .flower-ascii{text-anchor:middle}
  .tile rect{fill:var(--tile);stroke:var(--line);stroke-width:1;vector-effect:non-scaling-stroke}
  .tile .mono{font:500 14px var(--mono);fill:#333}
  .tile{outline:none}
  .mode-prune,.mode-prune .tile.live{cursor:var(--cur-prune,pointer)}
  .mode-water,.mode-water .tile.live{cursor:var(--cur-can,default)}
  .mode-plant,.mode-plant .tile.live{cursor:var(--cur-shovel,default)}
  #stage.view-compost,#stage.view-compost .tile.live{cursor:var(--cur-shovel,default)}
  #stage.view-stroll{cursor:grab}
  #stage.pan,#stage.pan .tile.live{cursor:grab}
  #stage.view-stroll.dragging,#stage.pan.dragging,#stage.pan.dragging .tile.live{cursor:grabbing}
  .plot{stroke:var(--line);stroke-width:1;vector-effect:non-scaling-stroke}
  .plot.mine{stroke:var(--ink);stroke-width:3}
  #stage.view-stroll #plots .plot{cursor:pointer}
  #stage.view-stroll.dragging #plots .plot{cursor:grabbing}
  #stage.view-stroll #plots g:hover .plot{stroke:var(--ink);stroke-width:2}
  .pglyph{fill:var(--ink);text-anchor:middle;dominant-baseline:central;font-family:var(--mono),'Noto Sans Symbols 2','Apple Symbols','Segoe UI Symbol',sans-serif}
  .chip rect{fill:var(--ink)}
  .chip text{font:400 14px var(--mono);fill:var(--bg);text-anchor:middle;dominant-baseline:central}
  .tile.live:hover rect,.tile.live:focus-visible rect{stroke-width:2.5}
  .tile image{pointer-events:none}
  .tile.ghost{opacity:.55}

  .pour{position:fixed;width:0;height:0;pointer-events:none;z-index:5;font:400 18px/1 var(--mono);color:var(--ink)}
  .pour .d{position:absolute;left:var(--x);top:0;opacity:0;animation:fall .4s linear 2 both}
  .pour .splash{position:absolute;left:-4px;top:78px;white-space:pre;opacity:0;animation:splash .9s ease-out .6s both}
  @keyframes fall{0%{opacity:0;transform:translate(0,0)}15%{opacity:1}85%{opacity:1}100%{opacity:0;transform:translate(var(--dx),74px)}}
  @keyframes splash{0%{opacity:0;letter-spacing:-2px}30%{opacity:1}100%{opacity:0;letter-spacing:8px}}
  @media (prefers-reduced-motion: reduce){.pour .d{animation:none;opacity:1;transform:translate(var(--dx),calc(var(--i) * 22px))}.pour .splash{animation:none;opacity:1}}
  .pop{transform-box:fill-box;transform-origin:center}
  .tile.enter .pop{animation:pop .4s ease-out}
  .tile.leaving .pop{animation:out .22s ease-in forwards}
  .flower.enter{animation:grow .7s ease-out}
  @keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes out{to{transform:scale(.5);opacity:0}}
  @keyframes grow{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){.tile.enter .pop,.tile.leaving .pop,.flower.enter{animation:none}}

  .top{position:fixed;left:32px;right:32px;top:calc(35px + env(safe-area-inset-top,0px));display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:12px;pointer-events:none}
  .top>*{pointer-events:auto}
  .tabs{display:flex;gap:14px}
  .stroll{justify-self:end}
  .np{display:inline-flex;align-items:center;justify-content:center;gap:12px;width:200px;border:1px solid var(--ink);border-radius:4px;padding:4px 16px;font:400 16px/21px var(--mono);background:color-mix(in srgb,var(--bg) 75%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
  .np svg{width:22px;height:14px;stroke:var(--ink);stroke-width:1.6;fill:none}

  .rail{position:fixed;left:32px;bottom:calc(32px + env(safe-area-inset-bottom,0px));width:42px;box-sizing:border-box;border:1px solid var(--line);border-radius:4px;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
  .rail button{width:100%;height:36px;border:0;background:transparent;color:var(--ink);cursor:pointer;display:grid;place-items:center;padding:0}
  .rail button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
  .rail hr{margin:0;border:0;border-top:1px solid var(--line)}
  .rail svg,.theme svg{width:22px;height:22px;stroke:currentColor;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .theme{position:fixed;right:32px;bottom:calc(32px + env(safe-area-inset-bottom,0px));display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--bg)}
  .theme button{width:36px;height:36px;border:0;background:transparent;color:var(--ink);cursor:pointer;display:grid;place-items:center;padding:0}
  .theme button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
  .theme button:focus-visible{outline:2px solid var(--ink);outline-offset:-4px}

  .modes{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(31px + env(safe-area-inset-bottom,0px));display:flex;gap:13px}
  .tray{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(82px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:8px;max-width:calc(100vw - 32px);overflow-x:auto;padding:8px;border:1px solid var(--ink);border-radius:4px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font:400 13px var(--mono);z-index:5}
  .tray .none{padding:4px 10px;opacity:.7;white-space:nowrap}
  .tray svg{width:40px;height:40px;display:block}
  .tray svg rect{fill:var(--tile);stroke:var(--line)}
  .tray svg text{font:400 7px var(--mono);fill:#333;text-anchor:middle}
  .cflower{font:400 10px var(--mono);fill:var(--bg);text-anchor:middle}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(126px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);font:400 13px/1.4 var(--mono);padding:6px 14px;border-radius:4px;max-width:calc(100vw - 32px);text-align:center}
  :root[data-theme="light"] button:not(.linkish){background:rgba(245,245,245,.75);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
  :root[data-theme="dark"] button:not(.linkish){background:color-mix(in srgb,var(--bg) 75%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
  :root[data-theme="light"] .btn.on,
  :root[data-theme="light"] .btn[aria-selected="true"],
  :root[data-theme="light"] .btn[aria-pressed="true"],
  :root[data-theme="light"] .rail button[aria-pressed="true"],
  :root[data-theme="light"] .theme button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
  :root[data-theme="dark"] .btn.on,
  :root[data-theme="dark"] .btn[aria-selected="true"],
  :root[data-theme="dark"] .btn[aria-pressed="true"],
  :root[data-theme="dark"] .rail button[aria-pressed="true"],
  :root[data-theme="dark"] .theme button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
  [hidden]{display:none !important}

  dialog{width:300px;max-width:calc(100vw - 32px);min-height:280px;padding:24px;border:1px solid var(--line);border-radius:4px;background:color-mix(in srgb,var(--bg) 75%,transparent);color:var(--ink);font:400 16px/normal var(--ui);box-sizing:border-box;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
  dialog[open]{display:flex;flex-direction:column;align-items:center}
  dialog::backdrop{background:transparent}
  .dlg-head{display:flex;justify-content:space-between;align-items:center;height:20px;width:100%;margin:0}
  .icon-btn{width:20px;height:20px;border:0;background:transparent;padding:0;color:var(--ink);cursor:pointer}
  .icon-btn svg{width:20px;height:20px;stroke:currentColor;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .icon-btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  dialog h2{margin:12px 0 0;font:400 16px/normal var(--ui);text-align:center;width:100%}
  .who{display:grid;justify-items:center;gap:8px;margin:20px 0;font:400 12px/normal var(--ui);width:100%}
  .who img,.who svg{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#fff;object-fit:cover;display:block}
  .who svg{border-radius:4px}
  .facts{margin:0;display:grid;gap:12px;width:100%}
  .facts div{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .facts dt,.facts dd{margin:0}
  .linkish{border:0;background:none;padding:0;font:inherit;color:inherit;text-decoration:underline;cursor:pointer}
  .actions{display:flex;gap:12px;justify-content:center;margin-top:20px}
  .actions .btn{font-family:var(--ui);font-size:16px;padding:5px 18px;min-width:96px}
  .flower-dlg{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:180px}
  .flower-dlg h2{margin:6px 0 20px}
  .flower-dlg .actions{margin-top:2px}

  /* Wind: only the grass moves, and all of it moves together (see windStep) */
  /* Clippings that fly off when the scissors snip */
  .snip{position:fixed;width:0;height:0;pointer-events:none;z-index:5;font:400 14px/1 var(--mono);color:var(--ink)}
  .snip i{position:absolute;left:0;top:0;font-style:normal;opacity:0;animation:clip .7s ease-out both;animation-delay:var(--dl)}
  @keyframes clip{0%{opacity:0;transform:translate(0,0)}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy))}}

  /* My Garden menu */
  .gwrap{position:relative}
  #tab-garden{display:inline-flex;align-items:center;gap:8px}
  #tab-garden .chev{display:none;width:16px;height:16px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
  #tab-garden[aria-selected="true"] .chev{display:block}
  #tab-garden[aria-expanded="true"] .chev rect{fill:color-mix(in srgb,currentColor 18%,transparent)}
  .gmenu{position:fixed;left:32px;top:calc(35px + env(safe-area-inset-top,0px) + 50px);width:268px;max-width:calc(100vw - 64px);max-height:calc(100vh - 300px);overflow:auto;box-sizing:border-box;padding:16px 16px 8px;border:1px solid var(--line);border-radius:4px;background:color-mix(in srgb,var(--bg) 75%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:var(--ink);z-index:6;font:400 13px/1.4 var(--mono);animation:gin .18s ease-out}
  .gmenu[hidden]{display:none}
  @keyframes gin{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){.gmenu{animation:none}}
  .ghead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 12px}
  .ghead h3{margin:0 !important}
  :root[data-theme] .gmenu button.gclose{width:24px;height:24px;flex:none;display:grid;place-items:center;padding:0;border:0;border-radius:4px;background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;color:var(--ink);cursor:pointer}
  :root[data-theme] .gmenu button.gclose:hover,:root[data-theme] .gmenu button.gclose:focus-visible{background:color-mix(in srgb,var(--ink) 10%,transparent);outline:none}
  .gclose svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .gshape{display:block;width:100%;height:auto;margin:0 0 12px;border:1px solid var(--line);border-radius:4px}
  .np{cursor:pointer;color:var(--ink)}
  .np:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .np path{transform-box:fill-box;transform-origin:50% 100%}
  .np.playing path{animation:eq 1s ease-in-out infinite alternate}
  .np.playing path:nth-child(1){animation-duration:.8s;animation-delay:-.2s}
  .np.playing path:nth-child(2){animation-duration:1.1s;animation-delay:-.7s}
  .np.playing path:nth-child(3){animation-duration:.9s;animation-delay:-.4s}
  .np.playing path:nth-child(4){animation-duration:1.25s;animation-delay:-.1s}
  .np.playing path:nth-child(5){animation-duration:.95s;animation-delay:-.6s}
  @keyframes eq{from{transform:scaleY(.2)}to{transform:scaleY(1)}}
  @media (prefers-reduced-motion: reduce){.np.playing path{animation:none}}
  .gmenu h3{margin:0 0 12px;font:500 14px/21px var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .gfacts{margin:0 0 12px;display:grid;gap:8px}
  .gfacts div{display:flex;justify-content:space-between;gap:12px}
  .gfacts dt,.gfacts dd{margin:0}
  .gfacts dt{opacity:.7}
  .gfacts dd{text-align:right}
  .gmenu hr{border:0;border-top:1px solid var(--line);margin:0 0 8px}
  :root[data-theme] .gmenu button.gitem{display:block;width:100%;box-sizing:border-box;text-align:left;border:0;border-radius:4px;background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;color:var(--ink);font:400 14px/21px var(--mono);padding:5px 8px;margin:0 0 4px;cursor:pointer}
  :root[data-theme] .gmenu button.gitem:hover,:root[data-theme] .gmenu button.gitem:focus-visible{background:color-mix(in srgb,var(--ink) 10%,transparent);outline:none}
  #dlg-rename{min-height:210px}
  .rename-input{width:100%;box-sizing:border-box;margin:20px 0 0;font:400 14px/21px var(--mono);color:var(--ink);background:transparent;border:1px solid var(--ink);border-radius:4px;padding:5px 10px}
  .rename-input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  #dlg-rename .actions{margin-top:auto;padding-top:20px}

  @media (max-width:640px){
    .top{left:12px;right:12px;gap:6px}
    .btn,.np{font-size:12px;padding:4px 10px}
    .tabs{gap:8px}
    .np span{display:none}
    .rail{left:12px}.theme{right:12px}
  }
  :root[data-theme] .tray button{flex:none;display:block;width:auto;height:auto;padding:0;border:0;border-radius:4px;background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;color:var(--ink);cursor:pointer}
  :root[data-theme] .tray button:hover{background:color-mix(in srgb,var(--ink) 10%,transparent)}
  :root[data-theme] .tray button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .vtag{display:flex;align-items:center;gap:8px;cursor:default;pointer-events:none}
  .vtag svg{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<svg id="stage" viewBox="0 0 1440 1024" preserveAspectRatio="xMidYMid meet" role="group" aria-label="Your garden"></svg>

<header class="top">
  <div class="tabs" id="tabs" role="tablist" aria-label="Garden views">
    <div class="gwrap">
      <button class="btn" role="tab" id="tab-garden" aria-selected="true" aria-expanded="false" aria-controls="gmenu"><span id="gname">My Garden</span><svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></svg></button>
    </div>
    <button class="btn" role="tab" id="tab-compost" aria-selected="false">Compost</button>
  </div>
  <div class="btn on vtag" id="vtag" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span>Visiting: <span id="vtag-name"></span></span></div>
  <button class="np" id="np" aria-pressed="false" aria-label="Play Mice on Venus" title="Play or pause">
    <svg viewBox="0 0 24 14" aria-hidden="true"><path d="M2 6v8"/><path d="M7 0v14"/><path d="M12 4v10"/><path d="M17 7v7"/><path d="M22 2v12"/></svg>
    <span id="np-title">Mice on Venus</span>
  </button>
  <button class="btn stroll" id="stroll">Go for a Stroll</button>
</header>

<aside class="gmenu" id="gmenu" hidden aria-label="Garden details">
  <div class="ghead">
    <h3 id="gmenu-title">My Garden</h3>
    <button class="gclose" id="gpanel-close" aria-label="Collapse panel"><svg viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></svg></button>
  </div>
  <svg class="gshape" id="gshape" viewBox="0 0 236 150" role="img" aria-label="The shape of your plot"></svg>
  <dl class="gfacts" id="gfacts"></dl>
  <hr>
  <div role="group" aria-label="Garden actions">
    <button class="gitem" id="g-rename">Rename garden</button>
    <button class="gitem" id="g-exit">Exit</button>
  </div>
</aside>

<div class="rail" id="rail" role="toolbar" aria-label="Zoom and pan">
  <button id="zout" aria-label="Zoom out"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4M8 11h6"/></svg></button>
  <button id="zin" aria-label="Zoom in"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4M8 11h6M11 8v6"/></svg></button>
  <hr>
  <button id="hand" aria-label="Drag to pan" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M8 12V5.5a1.5 1.5 0 013 0V11m0-1V4.5a1.5 1.5 0 013 0V11m0-4.5a1.5 1.5 0 013 0V14a6 6 0 01-6 6h-1a6 6 0 01-5-2.7L4 14a1.6 1.6 0 012.6-1.8L8 14"/></svg></button>
</div>

<div class="theme" role="group" aria-label="Theme">
  <button id="light" aria-label="Light theme" aria-pressed="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
  <button id="dark" aria-label="Dark theme" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"/></svg></button>
</div>

<div class="tray" id="tray" hidden></div>
<div class="modes" id="cmodes" role="group" aria-label="Compost tools" hidden>
  <button class="btn on" data-cmode="fertilize" aria-pressed="true">Fertilize</button>
  <button class="btn" data-cmode="harvest" aria-pressed="false">Harvest</button>
</div>
<div class="modes" id="modes" role="group" aria-label="Garden tools">
  <button class="btn on" data-mode="prune" aria-pressed="true">Prune</button>
  <button class="btn" data-mode="water" aria-pressed="false">Water</button>
  <button class="btn" data-mode="plant" aria-pressed="false">Plant</button>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<dialog id="dlg-prune" aria-labelledby="prune-title">
  <div class="dlg-head">
    <button class="icon-btn" id="prune-x" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
    <button class="icon-btn" id="prune-expand" aria-label="Expand"><svg viewBox="0 0 24 24"><path d="M9 3H3v6M3 3l7 7M15 21h6v-6M21 21l-7-7"/></svg></button>
  </div>
  <h2 id="prune-title">Would you like to disconnect...</h2>
  <div class="who" id="prune-who"></div>

/* ---------- Sample garden ---------- */
const NS = 'http://www.w3.org/2000/svg';
const ICO = name => `icons/${name}.png`;
const APPS0 = [

/* ---------- What the onboarding flow saved (if anything) ---------- */
const SETUP = (() => {
  try {
    const v = JSON.parse(localStorage.getItem('digitalGarden.setup'));
    if (v && Array.isArray(v.categories) && v.categories.some(c => c && Array.isArray(c.apps) && c.apps.length)) return v;
  } catch (e) {}

})();
const MY_PLOT = {
  pts: SETUP && SETUP.plotShape && Array.isArray(SETUP.plotShape.pts) ? SETUP.plotShape.pts : null,       // outline drawn in onboarding, centred, longest side = 1
  pattern: SETUP && SETUP.plotShape && ['star','plus','circle'].includes(SETUP.plotShape.pattern) ? SETUP.plotShape.pattern : 'star'
};
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const normName = s => String(s).toLowerCase().replace(/\.(app|exe|dmg|apk)$/,'').replace(/[^a-z0-9]+/g,'');   // icons/<this>.png, e.g. icons/googlechrome.png
/* Short or alternate names that should land on the icon files in /icons */
const ICON_ALIAS = {chrome:'googlechrome', arc:'arcbrowser', photos:'applephotos', mail:'applemail', health:'applehealth', music:'applemusic',
  messages:'imessage', translate:'googletranslate', bankofamerica:'bofa', twitter:'x', merlin:'merlinbirdid', merlinbird:'merlinbirdid',
  opera:'operagx', sirius:'siriusxm', googlemail:'gmail', drive:'googledrive', fitnesspal:'myfitnesspal', inat:'inaturalist', kakao:'kakaotalk',
  ticketmaster:'livenation', googlekeep:'keep', applenotes:'notes'};
function iconAlts(n){            // every file name worth trying, best first
  const k = normName(n), first = normName(String(n).trim().split(/\s+/)[0]);
  const list = [ICON_ALIAS[k], k, k.replace(/^(apple|google|microsoft|adobe|ms|my)/, ''), k.replace(/(app|browser|music|mobile|messenger)$/, ''), ICON_ALIAS[first], first];
  const generic = ['apple','google','microsoft','adobe','music','mobile','messenger','my','app','browser'];
  return [...new Set(list.filter(x => x && x.length > 1 && !generic.includes(x)))].map(ICO);
}
const iconFor = n => iconAlts(n)[0];
function iconNext(el){             // an icon file wasn't found: try the next name, and fall back to the monogram
  const rest = (el.dataset.alt || '').split('|').filter(Boolean), next = rest.shift();
  el.dataset.alt = rest.join('|');
  if (next) el.setAttribute('href', next); else el.style.display = 'none';
}

/* ---------- Tree designs ----------
   Every category becomes one tree. The designs follow the Figma "tree" sheet: radial hubs, ladders, fans and combs,
   plus rings for very large categories. Each one is built with its trunk base at 0,0 and grows upward. */
function polar(cx, cy, dist, deg){
  const r = deg * Math.PI / 180;
  return {x: cx + dist * Math.sin(r), y: cy - dist * Math.cos(r)};
}
function dRadial(per){          // a hub with five rays; each ray ends in 1, 2 or 3 apps
  const C = {1:{H:250,RAY:100}, 2:{H:300,RAY:100,SIDE:50,SPLAY:38}, 3:{H:327,RAY:105.325,STEM:67.714,SIDE:56.428}}[per];
  const hub = {x:0, y:-C.H}, names = ['TOP','UR','LR','LL','UL'], slots = [], segs = [{x1:0,y1:0,x2:0,y2:hub.y,when:null}];
  [0,72,144,216,288].forEach((deg, i) => {
    const id = names[i], n = polar(hub.x, hub.y, C.RAY, deg), ids = [];
    const add = (d, a, j) => { const p = polar(n.x, n.y, d, a); slots.push({id:id+j, x:p.x, y:p.y, rot:a, fx:n.x, fy:n.y}); ids.push(id+j); };
    if (per === 1){ slots.push({id:id+'0', x:n.x, y:n.y, rot:deg, fx:hub.x, fy:hub.y}); return; }
    if (per === 2){ add(C.SIDE, deg - C.SPLAY, 0); add(C.SIDE, deg + C.SPLAY, 1); }
    else { add(C.STEM, deg, 0); add(C.SIDE, deg - 60, 1); add(C.SIDE, deg + 60, 2); }
    segs.push({x1:hub.x, y1:hub.y, x2:n.x, y2:n.y, when:ids});
  });
  return {slots, segs};
}
function dLadder(L, v){         // a trunk with a pair of diamonds at every level (and one on top for the symmetric one)
  const c = v === 'twin' ? {step:62, dx:58, off:31, top:false, rise:46, base:170}
          : v === 'lean' ? {step:60, dx:36, off:-30, top:false, rise:60, base:170}
          :                {step:69.549, dx:69.549, off:0, top:true, rise:69.549, base:191.2};
  const a0 = -(c.base + c.step * (L - 1)), slots = [], segs = [{x1:0,y1:0,x2:0,y2:Math.min(a0, a0 + c.off),when:null}];
  if (c.top) slots.push({id:'T', x:0, y:a0 - 98.36, rot:0, fx:0, fy:a0});
  for (let i = 0; i < L; i++){
    const a = -(c.base + c.step * (L - 1 - i));
    slots.push({id:'L'+i, x:-c.dx, y:a - c.rise,         rot:-45, fx:0, fy:a});
    slots.push({id:'R'+i, x: c.dx, y:a + c.off - c.rise, rot: 45, fx:0, fy:a + c.off});
  }
  return {slots, segs};
}
function dArc(n, R, H, span){   // apps fan out along an arc above the trunk
  const slots = [], segs = [{x1:0,y1:0,x2:0,y2:-H,when:null}];
  for (let i = 0; i < n; i++){ const a = -span + 2*span*i/(n - 1), p = polar(0, -H, R, a); slots.push({id:'S'+i, x:p.x, y:p.y, rot:a, fx:0, fy:-H}); }
  return {slots, segs};
}
function dComb(n){              // apps in one straight row, every one on its own stem
  const H = 268, pitch = 44, slots = [], segs = [{x1:0,y1:0,x2:0,y2:-H,when:null}];
  for (let i = 0; i < n; i++) slots.push({id:'S'+i, x:(i - (n-1)/2) * pitch, y:-(H + 189), rot:0, fx:0, fy:-H});
  return {slots, segs};
}
function dRings(n){             // very large categories: concentric arcs of apps around the top of the trunk
  const H = 200, slots = [], segs = [{x1:0,y1:0,x2:0,y2:-H,when:null}];
  let r = 125;
  while (slots.length < n){
    const full = Math.max(3, Math.floor(Math.PI * r / 58) + 1), count = Math.min(full, n - slots.length), step = 170 / (full - 1);
    for (let i = 0; i < count; i++){ const a = (i - (count - 1)/2) * step, p = polar(0, -H, r, a); slots.push({id:'S'+slots.length, x:p.x, y:p.y, rot:a, fx:0, fy:-H}); }
    r += 62;
  }
  return {slots, segs};
}
function makeGeom(d){
  const g = d.k === 'radial1' ? dRadial(1) : d.k === 'radial2' ? dRadial(2) : d.k === 'radial3' ? dRadial(3)
    : d.k === 'ladder' ? dLadder(d.L, 'sym') : d.k === 'twin' ? dLadder(d.L, 'twin') : d.k === 'lean' ? dLadder(d.L, 'lean')
    : d.k === 'arc7' ? dArc(7, 165, 240, 72) : d.k === 'arc9' ? dArc(9, 190, 270, 90) : d.k === 'comb10' ? dComb(10) : dRings(d.n);
  let minY = 0, hw = 0;
  g.slots.forEach(s => { minY = Math.min(minY, s.y - 30); hw = Math.max(hw, Math.abs(s.x) + 30); });
  g.minY = minY; g.hw = hw;
  return g;
}
/* The smallest design that holds every app; where two designs hold the same number, the category picks one so neighbours differ. */
function pickDesign(n, seed){
  const h = hash(seed, 5, 5);
  if (n <= 5)  return {k:'radial1'};
  if (n <= 7)  return {k:'arc7'};
  if (n === 8) return {k: h < .5 ? 'twin' : 'lean', L:4};
  if (n === 9) return h < .5 ? {k:'ladder', L:4} : {k:'arc9'};
  if (n === 10) return {k: h < .5 ? 'comb10' : 'radial2'};
  if (n <= 15) return h < .5 ? {k:'radial3'} : {k:'ladder', L:Math.ceil((n - 1) / 2)};
  return {k:'rings', n};
}

/* ---------- Sample garden (used until onboarding has saved one) ---------- */
function fromCategories(cats, pfx){
  const trees = [], apps = []; let n = 0;
  cats.filter(c => c && Array.isArray(c.apps) && c.apps.length).forEach((c, ci) => {
    const id = pfx + 't' + ci, name = String(c.name || 'Garden');
    trees.push({id, name, design:pickDesign(c.apps.length, ci + 1)});
    c.apps.forEach(raw => {
      n++; const nm = String(raw);
      apps.push({id:pfx+'a'+n, name:nm, label:nm, tree:id, kind:name, gb:+(.1 + hash(n,7,3) * hash(n,7,3) * 9).toFixed(1),
        since:MONTHS[Math.floor(hash(n,9,5) * 12)] + ' ' + (2015 + Math.floor(hash(n,11,2) * 11)), img:iconFor(nm), alts:iconAlts(nm).slice(1), mono:nm.slice(0,2), slot:null});
    });
  });
  return {trees, apps};
}
function buildData(){
  if (SETUP) return {...fromCategories(SETUP.categories, ''), assign:true};
  return {
    trees:[{id:'collect', name:'Collecting Thoughts', design:{k:'radial3'}}, {id:'create', name:'Creating Things', design:{k:'ladder', L:4}}],
    apps:APPS0.map(a => ({...a})), assign:false
  };
}
function assemble(d){                    // draw each tree's geometry and (for generated gardens) seat every app in a slot
  d.trees.forEach(t => { t.geom = makeGeom(t.design); });
  if (d.assign) d.trees.forEach(t => d.apps.filter(a => a.tree === t.id).forEach((a, i) => { a.slot = t.geom.slots[i].id; }));
  return d;
}

const CELL_W = 460, CELL_H = 660;      // each tree gets one cell of the garden, then drifts a little inside it
function layoutTrees(trees, seed = 0){
  const N = trees.length, cols = N <= 2 ? Math.max(N, 1) : N <= 6 ? 3 : 4, rows = Math.max(1, Math.ceil(N / cols));
  const stagger = cols > 1, SH = CELL_H / 4;                       // alternate columns sit SH above / below the middle
  const W = cols * CELL_W, H = rows * CELL_H + (stagger ? CELL_H / 2 : 0), top = 512 - H / 2 + (stagger ? SH : 0);
  trees.forEach((t, i) => {
    const r = Math.floor(i / cols), c = i - r * cols, inRow = r === rows - 1 ? N - r * cols : cols;     // the last row is centred
    t.cx = 720 - inRow * CELL_W / 2 + c * CELL_W + CELL_W / 2 + (hash(i, seed, 11) - .5) * 50;
    t.baseY = top + r * CELL_H + 585 + (stagger ? (c % 2 ? -SH : SH) : 0) + (hash(i, seed, 12) - .5) * 70;
    t.scale = Math.min(1, 520 / -t.geom.minY, (CELL_W / 2 - 14) / t.geom.hw);                          // tall or wide trees shrink to stay in their cell
  });
  return {cols, rows, fit:Math.max(.3, Math.min(1, 1380 / W, 940 / H))};
}

const AMBIENT = [
  [628,880,['||']],[866,671,['||']],[77,373,['||']],[1176,373,['||']],[1390,155,['||']],
  [310,155,['\\|/']],[1346,671,['\\|/']],[96,880,['\\|/']],[310,671,['\\|/']],[1132,880,['\\|/']],
  [1230,448,['(#)',' | ','~|~']],[246,745,['vvv','( )',' | ','\\|/']],[805,120,['oo','o*o','oo',' | ',' | ']]
];
const FLOWERS = [['[=]',' | ','~|~'], ['(#)',' | ','~|~'], ['~~~','\\ /',' | ','\\|/'], [' ^ ','< @ >',' v ',' | ',' | ']];
const SPOTS = [[140,520],[1180,590],[1300,770],[740,600],[150,690],[1250,230],[80,230],[1090,190]];

/* Compost: the layout from the Figma compost frame. Three rows of branches; `top` is the horizontal run, `c` the stem. */
const COMPOST_GROUPS = [
  {c:178,  top:285, tiles:[58,178,298],              mark:['{+}','|','~|~']},
  {c:720,  top:285, tiles:[600,720,840],             mark:['(#)','|','~|~']},
  {c:1262, top:285, tiles:[1142,1262,1382],          mark:['[=]','|','~|~']},
  {c:298,  top:533, tiles:[58,178,298,418,538],      mark:['vvv','(  )','|','\\|/']},
  {c:1142, top:533, tiles:[902,1022,1142,1262,1382], mark:['~~~','\\ /','|','\\|/']},
  {c:178,  top:829, tiles:[58,178,298],              mark:['{+}','|','~|~']},
  {c:720,  top:829, tiles:[600,720,840],             mark:['(#)','|','~|~']},
  {c:1262, top:829, tiles:[1142,1262,1382],          mark:['[=]','|','~|~']},
];

/* ---------- State ---------- */
const DATA = assemble(buildData());
const state = {
  apps: DATA.apps, trees: DATA.trees,
  compost: [],        // what's in the compost: {app} or {flower}, in the order it went in
  stock: FLOWERS.slice(),   // flowers ready to plant (each is its lines of ASCII); harvesting the compost adds more
  cmode: 'fertilize', harvests: 0,
  flowers: [],        // flowers planted in the garden: {lines, spot, fresh}
  mode:'prune', lastMode:'prune', view:'garden', zoom:1, panX:0, panY:0, hand:false,
  pending:null, fresh:new Set(), visit:null, own:null
};
const LAYOUT = layoutTrees(state.trees);
state.zoom = LAYOUT.fit;
let USER_SPOTS = SPOTS, AMBIENT_USE = AMBIENT;
function setSpots(custom){
  if (custom || SETUP){      // with several trees the garden has no fixed gaps, so flowers go beside each trunk instead
    USER_SPOTS = state.trees.map(t => [t.cx - 165, t.baseY - 140]);
    AMBIENT_USE = AMBIENT.filter(([,,l]) => l.length === 1).concat(state.trees.flatMap((t, i) =>
      hash(i,3,3) < .7 ? [[t.cx + 105, t.baseY - 140, FLOWERS[Math.floor(hash(i,4,4) * FLOWERS.length)]]] : []));
  } else { USER_SPOTS = SPOTS; AMBIENT_USE = AMBIENT; }
}
setSpots(false);
/* Each view remembers where you left it */
const viewPos = {};
function setView(v){
  if (v === state.view) return;
  viewPos[state.view] = {zoom:state.zoom, panX:state.panX, panY:state.panY};
  state.view = v;
  Object.assign(state, viewPos[v] || {zoom: v === 'garden' ? LAYOUT.fit : 1, panX:0, panY:0});
  render();
}

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const stage = $('#stage');
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ICON_NAMES = {notes:'Notes',ottarai:'Otter.ai',otter:'Otter',onenote:'OneNote',wisprflow:'Wispr Flow',indesign:'InDesign'};
function appLabel(app){
  if (app.label) return app.label;
  const file = app.img ? app.img.split('/').pop().replace(/\.png$/,'') : '';
  return ICON_NAMES[file] || (file ? file[0].toUpperCase()+file.slice(1) : app.name);
}
function glyph(app, clipId='tileClip'){
  /* the monogram sits underneath and is hidden once icons/<name>.png loads, so a missing icon still reads as an app */
  const mono = `<text class="mono" x="20" y="25" text-anchor="middle">${esc(app.mono||app.name.slice(0,2))}</text>`;
  if (!app.img) return mono;
  return mono + `<image href="${esc(app.img)}" x="0" y="0" width="40" height="40" preserveAspectRatio="xMidYMid slice" clip-path="url(#${clipId})" data-alt="${esc((app.alts||[]).join('|'))}" onload="this.previousElementSibling.style.display='none'" onerror="iconNext(this)"/>`;
}
function flowerSvg(lines){
  const y0 = 22 - (lines.length - 1) * 3.8;
  return `<svg viewBox="0 0 40 40" aria-hidden="true"><rect x=".5" y=".5" width="39" height="39" rx="4"/><text xml:space="preserve">${lines.map((l,i)=>`<tspan x="20" y="${(y0+i*7.6).toFixed(1)}">${esc(l)}</tspan>`).join('')}</text></svg>`;
}
function tileSvg(app){
  const id = 'clip-'+app.id;
  return `<svg viewBox="0 0 40 40" aria-hidden="true"><defs><clipPath id="${id}"><rect x=".5" y=".5" width="39" height="39" rx="4"/></clipPath></defs><rect x=".5" y=".5" width="39" height="39" rx="4"/>${glyph(app,id)}</svg>`;
}
function ascii(lines,x,y,cls='',step=24){
  const t = lines.map((l,i)=>`<tspan x="${x}" y="${y+19+i*step}">${esc(l)}</tspan>`).join('');
  return `<text class="ascii ${cls}" xml:space="preserve">${t}</text>`;
}
function line(x1,y1,x2,y2){ return `<path class="tree-line" d="M${x1} ${y1}L${x2} ${y2}"/>`; }
function dot(x,y){ return `<circle class="dot" cx="${x}" cy="${y}" r="2.5"/>`; }
function compostBranch(center, top, x, R=24){
  if (x===center) return line(center, top-R, center, top+R);
  const direction = Math.sign(x-center), radius = Math.min(R, Math.abs(x-center)/2);
  const turnStart = top-radius, horizontalStart = center + direction*radius;
  const horizontalEnd = x - direction*radius, turnEnd = top+radius;
  const path = `M${center} ${top-R}V${turnStart}Q${center} ${top} ${horizontalStart} ${top}H${horizontalEnd}Q${x} ${top} ${x} ${turnEnd}V${top+R}`;
  return `<path class="tree-line" d="${path}"/>`;
}
function tile(app,x,y,{live=true,ghost=false,rot=0,scale=1}={}){
  const cls = ['tile', live?'live':'', ghost?'ghost':'', state.fresh.has(app.id)?'enter':''].join(' ');
  const attrs = live ? `role="button" tabindex="0" data-app="${app.id}" aria-label="${esc(appLabel(app))}, ${esc(app.kind)}"` : `aria-hidden="true"`;
  return `<g class="${cls}" ${attrs} transform="translate(${x} ${y}) rotate(${rot}) scale(${scale}) translate(-20 -20)"><g class="pop"><rect x=".5" y=".5" width="39" height="39" rx="4"/>${glyph(app)}</g></g>`;
}

/* ---------- Render ---------- */
function occupant(tree,slotId){ return state.apps.find(a=>a.tree===tree && a.slot===slotId); }

function renderTree(t){
  const g = t.geom, occ = new Set(), tiles = [];
  g.slots.forEach(sl => { if (occupant(t.id, sl.id)) occ.add(sl.id); });
  let out = '';

  $('#prune-facts').innerHTML =
    `<div><dt>${app.gb.toFixed(1)} GB data</dt><dd><button class="linkish" id="export">Export</button></dd></div>` +
    `<div><dt>Category:</dt><dd>${esc(app.kind)}</dd></div>` +
    `<div><dt>Downloaded:</dt><dd>${esc(app.since)}</dd></div>`;
  $('#export').onclick = () => toast('Export isn’t connected in this prototype.');
  dlgPrune.showModal();
}
function closePrune(){ dlgPrune.close(); }
$('#prune-x').onclick = closePrune;
$('#prune-expand').onclick = () => toast('Full details aren’t connected in this prototype.');
$('#prune-keep').onclick = closePrune;
dlgPrune.addEventListener('close', ()=>{ /* keep pending only if flow continues */ });
$('#prune-go').onclick = () => {
  const app = state.pending; if(!app) return;
  closePrune();
  const el = stage.querySelector(`[data-app="${app.id}"]`);
  if (el) el.classList.add('leaving');
  const delay = matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 230;
  setTimeout(()=>{
    app.slot = 'gone';
    state.compost.push({app});
    render();
  }, delay);
};

/* ---------- Planting ---------- */
function growTree(tree){           // a full tree grows into the next size up; apps keep their order
  const old = tree.geom.slots.map(sl => sl.id);
  const members = state.apps.filter(a => a.tree === tree.id && a.slot && a.slot !== 'gone').sort((a, b) => old.indexOf(a.slot) - old.indexOf(b.slot));
  tree.design = pickDesign(members.length + 1, state.trees.indexOf(tree) + 1);
  tree.geom = makeGeom(tree.design);
  members.forEach((a, i) => { a.slot = tree.geom.slots[i].id; });
  layoutTrees(state.trees);
}
function plant(id){
  const app = state.apps.find(a=>a.id===id); if(!app) return;
  const tree = treeOf(app.tree); let free = tree.geom.slots.find(s=>!occupant(app.tree,s.id)), grew = false;
  if (!free){ growTree(tree); free = tree.geom.slots.find(s=>!occupant(app.tree,s.id)); grew = true; }
  app.slot = free.id; state.fresh.add(app.id); render();
  if (grew) toast(`The ${tree.name} tree grew to make room.`);
}
function plantFlower(i){
  const lines = state.stock[i]; if (!lines) return;
  const used = new Set(state.flowers.map(f=>f.spot)), spot = USER_SPOTS.findIndex((_,k)=>!used.has(k));
  if (spot < 0){ toast('The garden has no room for another flower.'); return; }
  state.stock.splice(i, 1); state.flowers.push({lines, spot, fresh:true}); render();
}


/* ---------- Watering can (custom icon, drawn to match Lucide: 24px grid, 2px-family round strokes) ---------- */
const CAN_ICON = '<rect x="4" y="9" width="11" height="11" rx="2"/><path d="M6 9V7.5a2.5 2.5 0 0 1 5 0V9"/><path d="M15 16l5-6"/><path d="M18.5 8.7l3 2.6"/>';
const SCISSORS_ICON = '<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.1 15.9M14.5 14.5 20 20M8.1 8.1 12 12"/>';
const SHOVEL_ICON = '<path d="M21.56 4.56a1.5 1.5 0 0 1 0 2.122l-.47.47a3 3 0 0 1-4.212-.03 3 3 0 0 1 0-4.243l.44-.44a1.5 1.5 0 0 1 2.121 0z"/><path d="M3 22a1 1 0 0 1-1-1v-3.586a1 1 0 0 1 .293-.707l3.355-3.355a1.205 1.205 0 0 1 1.704 0l3.296 3.296a1.205 1.205 0 0 1 0 1.704l-3.355 3.355a1 1 0 0 1-.707.293z"/><path d="m9 15 7.879-7.878"/>';
const THEME_COLORS = {light:{bg:'#f5f5f5', ink:'#2b2b2b'}, dark:{bg:'#1b1b1b', ink:'#ececec'}};
function cursorUrl(inner, hx, hy, fallback, {size=32, vb='0 0 24 24', theme='light'}={}){
  const c = THEME_COLORS[theme];     // the outline matches the page background and the icon is the ink colour, so both invert with the theme
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="${vb}" fill="none" stroke-linecap="round" stroke-linejoin="round"><g stroke="${c.bg}" stroke-width="4">${inner}</g><g stroke="${c.ink}" stroke-width="1.6">${inner}</g></svg>`;
  return `url("data:image/svg+xml,${encodeURIComponent(svg)}") ${hx} ${hy}, ${fallback}`;
}
const root = document.documentElement;
/* The can cursor is pre-rendered at a few tilt angles around the rose (the spout tip, which is also the hotspot),
   so on click the real cursor tips forward and back. */
let CAN_FRAMES = [], canFrame = 0, SCISSOR_FRAMES = [], scissorFrame = 0;
const setCan = i => { canFrame = i; root.style.setProperty('--cur-can', CAN_FRAMES[i]); };
const setScissors = i => { scissorFrame = i; root.style.setProperty('--cur-prune', SCISSOR_FRAMES[i]); };
/* Scissors, split into two blades that rotate about the pivot (12,12) so the cursor can snip shut and open again */
const scissorsInner = t =>
  `<g transform="rotate(${t} 12 12)"><path d="M20 4 8.1 15.9"/><circle cx="6" cy="18" r="3"/></g>` +
  `<g transform="rotate(${-t} 12 12)"><path d="M14.5 14.5 20 20M8.1 8.1 12 12"/><circle cx="6" cy="6" r="3"/></g>`;
function buildCursors(theme){
  SCISSOR_FRAMES = [0,13,25,34].map(t => cursorUrl(scissorsInner(t), 18, 18, 'pointer', {size:36, vb:'-2 -2 28 28', theme}));
  root.style.setProperty('--cur-shovel', cursorUrl(SHOVEL_ICON, 9, 15, 'default', {theme}));
  CAN_FRAMES = [0,22,44,64].map(deg =>
    cursorUrl(`<g transform="rotate(${deg} 20 10)">${CAN_ICON}</g>`, 46, 24, 'default', {size:54, vb:'-14 -8 40 40', theme}));
  setScissors(scissorFrame); setCan(canFrame);
}

let canTimers = [];
function pour(x, y){
  canTimers.forEach(clearTimeout); canTimers = [];
  document.querySelectorAll('.pour').forEach(n=>n.remove());
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const at = (ms, fn) => canTimers.push(setTimeout(fn, ms));
  (reduce ? [[0,3],[700,0]] : [[0,0],[60,1],[120,2],[180,3],[1300,2],[1360,1],[1420,0]])
    .forEach(([ms,i]) => at(ms, () => setCan(i)));
  const chars = ["'", ':', '.'];
  let html = '';
  for (let c=0; c<3; c++) for (let r=0; r<3; r++){
    html += `<span class="d" style="--x:${c*11}px;--dx:${8+c*6}px;--i:${r};animation-delay:${(.2 + r*.14 + c*.05).toFixed(2)}s">${chars[(c+r)%3]}</span>`;
  }
  html += '<span class="splash">~ ~ ~</span>';
  const el = document.createElement('div');
  el.className = 'pour'; el.setAttribute('aria-hidden','true');
  el.style.left = x+'px'; el.style.top = y+'px'; el.innerHTML = html;
  document.body.appendChild(el);
  at(reduce ? 700 : 1700, () => el.remove());
}

let snipTimers = [];
const SNIP_SEQ = [[0,1],[45,2],[90,3],[150,2],[200,1],[250,0],[330,1],[375,2],[420,3],[480,2],[530,1],[580,0]];   // two quick snips
function snip(x, y){
  snipTimers.forEach(clearTimeout); snipTimers = [];
  document.querySelectorAll('.snip').forEach(n=>n.remove());
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const at = (ms, fn) => snipTimers.push(setTimeout(fn, ms));
  (reduce ? [[0,3],[160,0]] : SNIP_SEQ).forEach(([ms,i]) => at(ms, () => setScissors(i)));
  if (reduce) return;
  const bits = ["'", ',', '.', '~', "'", ','];
  const el = document.createElement('div');
  el.className = 'snip'; el.setAttribute('aria-hidden','true');
  el.style.left = (x+10)+'px'; el.style.top = (y-4)+'px';
  el.innerHTML = bits.map((c,i)=>`<i style="--dx:${(i%2 ? 1 : -1)*(10+i*5)}px;--dy:${20+i*7}px;--dl:${(.05+i*.07).toFixed(2)}s">${c}</i>`).join('');
  document.body.appendChild(el);
  at(1300, () => el.remove());
}

/* ---------- Interaction ---------- */
function activate(el){
  const app = state.apps.find(a=>a.id===el.dataset.app); if(!app) return;
  if (state.mode==='prune') openPrune(app);
}
stage.addEventListener('click', e => {
  if (state.hand || state.visit) return;
  if (state.mode==='water'){ pour(e.clientX, e.clientY); return; }
  const el = e.target.closest('[data-app]'); if (el) activate(el);
});
stage.addEventListener('keydown', e => {
  if (e.key!=='Enter' && e.key!==' ') return;
  const el = e.target.closest('[data-app]'); if (!el || state.visit) return;
  e.preventDefault();
  const r = el.getBoundingClientRect();
  if (state.mode==='water') pour(r.left+r.width/2, r.top+r.height/2);
  else { if (state.mode==='prune' && state.view==='garden') snip(r.left+r.width/2, r.top+r.height/2); activate(el); }
});
$('#tray').addEventListener('click', e => {
  const b = e.target.closest('[data-seed],[data-flower],[data-entry]'); if (!b) return;
  if (state.view === 'compost'){ compostAction(b); return; }
  if (b.dataset.seed) plant(b.dataset.seed); else plantFlower(+b.dataset.flower);
});
document.querySelectorAll('[data-cmode]').forEach(b => b.addEventListener('click', () => { state.cmode = b.dataset.cmode; render(); }));
/* The hand and the three garden tools are one group: choosing any of them un-chooses the others */
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{ state.mode = state.lastMode = b.dataset.mode; state.hand = false; render(); }));
$('#tab-garden').onclick = () => {
  if (state.visit){ leaveVisit('garden'); return; }
  if (state.view !== 'garden'){ setView('garden'); return; }
  gmenu.hidden ? openMenu() : closeMenu(false);
};
$('#tab-compost').onclick = () => { closeMenu(false); if (state.visit) leaveVisit('garden'); setView('compost'); };
$('#stroll').onclick = () => { closeMenu(false); if (state.visit){ leaveVisit('stroll'); return; } setView('stroll'); };

/* zoom + pan */
function setZoom(z){ state.zoom = Math.min(2.4, Math.max(.3, z)); const w=$('#world'); if(w) w.setAttribute('transform', transform()); ensureWorld(); }
$('#zin').onclick = () => setZoom(state.zoom*1.2);
$('#zout').onclick = () => setZoom(state.zoom/1.2);
$('#hand').onclick = () => {
  if (state.visit) return;
  if (state.hand){ state.hand = false; state.mode = state.lastMode || 'prune'; }     // putting the hand down brings back the last tool
  else { if (state.mode) state.lastMode = state.mode; state.hand = true; state.mode = null; }
  render();
};
let drag=null, down=null;
stage.addEventListener('pointerdown', e => {
  if (state.view==='garden' && state.mode==='prune' && !state.hand && !state.visit) snip(e.clientX, e.clientY);
  down = {x:e.clientX, y:e.clientY, plot:state.view==='stroll' && e.target.closest ? e.target.closest('#plots > [data-t]') : null};
  if(!state.hand && state.view!=='stroll') return; drag={x:e.clientX,y:e.clientY,px:state.panX,py:state.panY}; stage.classList.add('dragging'); stage.setPointerCapture(e.pointerId); });
stage.addEventListener('pointermove', e => {
  if(!drag) return;
  const r = stage.getBoundingClientRect(), f = Math.min(r.width/1440, r.height/1024);
  state.panX = drag.px + (e.clientX-drag.x)/f; state.panY = drag.py + (e.clientY-drag.y)/f;
  $('#world').setAttribute('transform', transform());
  queueWorld();
});
const endDrag = e => {
  const d0 = down; down = null; drag = null; stage.classList.remove('dragging');
  if (e && e.type==='pointerup' && d0 && d0.plot && Math.hypot(e.clientX-d0.x, e.clientY-d0.y) < 6 && d0.plot.firstElementChild){   // a tap, not a drag
    const [i, j] = d0.plot.dataset.t.split(',').map(Number); enterVisit(i, j);
  }
};
stage.addEventListener('pointerup', endDrag); stage.addEventListener('pointercancel', endDrag);

/* theme */
const THEME_KEY = 'digitalGarden.theme';
function setTheme(t, remember){
  document.documentElement.setAttribute('data-theme', t);
  $('#light').setAttribute('aria-pressed', t==='light'); $('#dark').setAttribute('aria-pressed', t==='dark');
  buildCursors(t);
  if (remember){ try { localStorage.setItem(THEME_KEY, t); } catch (e) {} }
}
$('#light').onclick = () => setTheme('light', true);
$('#dark').onclick = () => setTheme('dark', true);
let savedTheme = null; try { savedTheme = localStorage.getItem(THEME_KEY); } catch (e) {}
setTheme(savedTheme==='light' || savedTheme==='dark' ? savedTheme : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));

/* ---------- Garden menu: info, rename, exit ---------- */
/* Placeholder weather for the prototype (swap for a live feed later). It changes by day, and its wind strength drives how much the plants sway. */
const WEATHER_SETS = [
  {sky:'Sunny',         temp:68, wind:'Light breeze',  mph:6,  factor:.8},
  {sky:'Partly cloudy', temp:61, wind:'Breezy',        mph:14, factor:1.25},
  {sky:'Overcast',      temp:55, wind:'Calm',          mph:3,  factor:.45},
  {sky:'Clear skies',   temp:59, wind:'Gentle breeze', mph:9,  factor:1}
];
const WEATHER = WEATHER_SETS[Math.floor(Date.now()/86400000) % WEATHER_SETS.length];
root.style.setProperty('--wind', WEATHER.factor);
const META_KEY = 'digitalGarden.meta';
function loadMeta(){
  try { const m = JSON.parse(localStorage.getItem(META_KEY)); if (m && m.created) return {name:m.name || 'My Garden', created:m.created}; } catch (e) {}
  const m = {name:'My Garden', created:new Date().toISOString()};
  try { localStorage.setItem(META_KEY, JSON.stringify(m)); } catch (e) {}
  return m;
}
const meta = loadMeta();
const saveMeta = () => { try { localStorage.setItem(META_KEY, JSON.stringify(meta)); } catch (e) {} };
const gmenu = $('#gmenu'), gbtn = $('#tab-garden');
function gardenStats(){
  const inGarden = state.apps.filter(a=>a.slot!=='gone'), gone = state.apps.filter(a=>a.slot==='gone');
  const sum = list => list.reduce((n,a)=>n+(a.gb||0), 0);
  return {planted:inGarden.filter(a=>a.slot).length, total:inGarden.length, gb:sum(inGarden), compost:gone.length, compostGb:sum(gone)};
}
function fillMenu(){
  const st = gardenStats(), d = new Date(meta.created);
  const created = isNaN(d) ? '' : d.toLocaleDateString(undefined, {year:'numeric', month:'short', day:'numeric'});
  $('#gmenu-title').textContent = meta.name;
  const S = 120, path = MY_PLOT.pts && MY_PLOT.pts.length >= 3 ? smoothClosed(MY_PLOT.pts.map(([x,y]) => [x*S, y*S])) : cloudPath(130, 110, 6, 7);
  $('#gshape').innerHTML = `<defs>${patternDefs('pp-', .5)}</defs><path d="${path}" transform="translate(118 75)" fill="url(#pp-${MY_PLOT.pattern})" stroke="var(--ink)" stroke-width="1.5"/>`;
  $('#gfacts').innerHTML =
    `<div><dt>Created</dt><dd>${esc(created)}</dd></div>` +
    `<div><dt>Data</dt><dd>${st.gb.toFixed(1)} GB</dd></div>` +
    `<div><dt>Apps planted</dt><dd>${st.planted} of ${st.total}</dd></div>` +
    `<div><dt>Compost</dt><dd>${st.compost} ${st.compost===1?'app':'apps'} · ${st.compostGb.toFixed(1)} GB</dd></div>` +
    `<div><dt>Weather</dt><dd>${esc(WEATHER.sky)}, ${WEATHER.temp}°F</dd></div>` +
    `<div><dt>Wind</dt><dd>${esc(WEATHER.wind)} · ${WEATHER.mph} mph</dd></div>`;
}
function applyName(){ $('#gname').textContent = meta.name; document.title = `${meta.name} · Digital Garden (prototype)`; }
function openMenu(){ fillMenu(); gmenu.hidden = false; gbtn.setAttribute('aria-expanded', 'true'); }
function closeMenu(refocus){ if (gmenu.hidden) return; gmenu.hidden = true; gbtn.setAttribute('aria-expanded', 'false'); if (refocus) gbtn.focus(); }
applyName();
$('#gpanel-close').onclick = () => closeMenu(true);       // it stays open until you collapse it
document.addEventListener('keydown', e => { if (e.key==='Escape' && !gmenu.hidden && !document.querySelector('dialog[open]')) closeMenu(true); });
const dlgRename = $('#dlg-rename'), renameInput = $('#rename-input');
$('#g-rename').onclick = () => { closeMenu(false); renameInput.value = meta.name; dlgRename.showModal(); renameInput.focus(); renameInput.select(); };
function saveRename(){
  const v = renameInput.value.trim();
  if (!v){ renameInput.focus(); return; }
  meta.name = v.slice(0, 24); saveMeta(); applyName(); dlgRename.close(); toast(`Garden renamed to ${meta.name}.`);
}
$('#rename-save').onclick = saveRename;
renameInput.addEventListener('keydown', e => { if (e.key==='Enter'){ e.preventDefault(); saveRename(); } });
$('#rename-cancel').onclick = () => dlgRename.close();
$('#rename-x').onclick = () => dlgRename.close();
$('#g-exit').onclick = () => { try { sessionStorage.removeItem('dg:entered'); } catch (e) {} location.href = 'onboarding.html'; };

/* ---------- Music badge: plays by default (click to pause). Every garden has its own song. ---------- */
const np = $('#np'), npTitle = $('#np-title');
const OWN_SONG = {title:'Mice on Venus', seed:1};
const SONG_POOL = ['Sweden','Wet Hands','Subwoofer Lullaby','Aria Math','Dry Hands','Haggstrom','Living Mice','Moog City','Danny','Blocks'];
const slug = t => t.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');       // audio/<song-title>.mp3
const SCALES = [[261.63,293.66,329.63,392,440,523.25,587.33], [220,246.94,261.63,329.63,349.23,440,493.88], [293.66,329.63,369.99,440,493.88,587.33,659.25], [196,220,246.94,293.66,329.63,392,440]];
let curSong = OWN_SONG, wantPlay = true, playing = false, usingSynth = false, ac = null, synth = null;
const track = new Audio(); track.loop = true; track.preload = 'none';
function makeAmbient(seed){            // stand-in when a song has no audio file: slow soft notes, a different mood for every seed
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return {start(){}, stop(){}};
  ac = ac || new AC();
  const master = ac.createGain(), delay = ac.createDelay(1), fb = ac.createGain(), lp = ac.createBiquadFilter();
  master.gain.value = 0; master.connect(ac.destination); delay.delayTime.value = .3 + (seed % 3) * .1; fb.gain.value = .42; lp.type = 'lowpass'; lp.frequency.value = 1800;
  delay.connect(fb); fb.connect(delay); delay.connect(lp); lp.connect(master);
  const scale = SCALES[seed % SCALES.length], gap = 700 + (seed % 4) * 150, wave = seed % 2 ? 'triangle' : 'sine'; let timer = null;
  const note = () => {
    if (ac.state !== 'running') return;                 // don't pile notes up while the browser is still waiting for a click
    const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
    o.type = wave; o.frequency.value = scale[Math.floor(Math.random()*scale.length)] * (Math.random() < .25 ? .5 : 1);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.2, t + .03); g.gain.exponentialRampToValueAtTime(.0008, t + 2.4);
    o.connect(g); g.connect(master); g.connect(delay); o.start(t); o.stop(t + 2.6);
  };
  return {
    start(){ ac.resume(); master.gain.linearRampToValueAtTime(.5, ac.currentTime + .8); note(); timer = setInterval(() => { if (Math.random() < .8) note(); }, gap); },
    stop(){ clearInterval(timer); master.gain.cancelScheduledValues(ac.currentTime); master.gain.linearRampToValueAtTime(0, ac.currentTime + .4); setTimeout(() => master.disconnect(), 700); }
  };
}
function showPlaying(on){ playing = on; np.classList.toggle('playing', on); np.setAttribute('aria-pressed', on); setSongLabel(); }
function setSongLabel(){ npTitle.textContent = curSong.title; np.setAttribute('aria-label', (playing ? 'Pause ' : 'Play ') + curSong.title); }
function stopAudio(){ track.pause(); if (synth){ synth.stop(); synth = null; } }
async function startAudio(){
  stopAudio(); showPlaying(true); usingSynth = false;
  track.src = `audio/${slug(curSong.title)}.mp3`;
  try { await track.play(); return; }
  catch (e) { if (e && e.name === 'NotAllowedError') return; }      // the browser wants a click first; unlock() retries on the first one
  usingSynth = true; synth = makeAmbient(curSong.seed); synth.start();
}
function setSong(song){ curSong = song; stopAudio(); showPlaying(false); if (wantPlay) startAudio(); }
function togglePlay(){ wantPlay = !wantPlay; if (wantPlay) startAudio(); else { stopAudio(); showPlaying(false); } }
function unlock(){                      // browsers block sound until the page is touched once
  if (!wantPlay) return;
  if (ac && ac.state === 'suspended') ac.resume();
  if (!usingSynth && track.src && track.paused) track.play().catch(() => {});
}
['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, unlock));
np.addEventListener('click', togglePlay);
startAudio();

render();
</script>
